{{ define "main" }}
  <header class="mt-5 max-w-prose">
    <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
      {{ .Title | emojify }}
    </h1>
    <p class="mt-3 text-lg leading-relaxed text-neutral-500 dark:text-neutral-400">
      {{ i18n "institutions_intro" }}
    </p>
  </header>

  <style>
    .inst-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      margin-top: 1.75rem;
    }

    .inst-card {
      background: #ffffff;
      border: 1px solid #d4d4d4;
      border-radius: 0.5rem;
      box-shadow: 0 12px 30px rgba(22, 22, 22, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1.25rem;
      text-decoration: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .inst-card:hover {
      border-color: rgba(76, 155, 135, 0.58);
      box-shadow: 0 18px 44px rgba(22, 22, 22, 0.12);
    }

    .dark .inst-card {
      background: rgba(28, 28, 28, 0.88);
      border-color: rgba(212, 212, 212, 0.16);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.32);
    }

    .dark .inst-card:hover {
      border-color: rgba(105, 183, 162, 0.64);
      box-shadow: 0 18px 44px rgba(76, 155, 135, 0.16);
    }

    .inst-card-name {
      color: #171717;
      font-size: 1.25rem;
      font-weight: 850;
      line-height: 1.25;
    }

    .dark .inst-card-name {
      color: #f5f5f5;
    }

    .inst-card-count {
      color: #2f7f6d;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .dark .inst-card-count {
      color: #8bd2be;
    }
  </style>

  <div class="inst-grid">
    {{ range .Data.Terms.Alphabetical }}
      <a class="inst-card" href="{{ .Page.RelPermalink }}">
        <span class="inst-card-name">{{ .Page.Title | emojify }}</span>
        <span class="inst-card-count">{{ i18n "tech_count_all" (dict "total" .Count) }}</span>
      </a>
    {{ end }}
  </div>
{{ end }}
